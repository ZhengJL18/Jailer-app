# Build APK on every push to master / PR.
# Artifact downloadable from GitHub Actions → Summary → Artifacts.
name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # release 构建：用仓库内的 jailer-release.jks 固定签名，
      # 「所有文件访问」权限（MANAGE_EXTERNAL_STORAGE）需要 release 签名才完整。
      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
